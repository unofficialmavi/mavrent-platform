<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1128" />
      <stop offset="100%" stop-color="#001f54" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background with rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect x="12" y="12" width="488" height="488" rx="116" stroke="rgba(255,255,255,0.08)" stroke-width="4" />
  
  <!-- Architectural roof peak / chevron accent representing rental properties -->
  <path d="M 256 96 L 380 200 L 344 200 L 256 128 L 168 200 L 132 200 Z" fill="#38bdf8" opacity="0.85" />

  <!-- Distinctive bold 'M' structure merged with building pillars -->
  <path d="M 128 200 L 180 200 L 180 400 L 128 400 Z" fill="url(#accentGrad)" filter="url(#glow)" rx="10" />
  <path d="M 332 200 L 384 200 L 384 400 L 332 400 Z" fill="url(#accentGrad)" filter="url(#glow)" rx="10" />
  <path d="M 176 200 L 256 312 L 336 200 L 296 200 L 256 256 L 216 200 Z" fill="#ffffff" />
  
  <!-- AI spark / key node -->
  <circle cx="256" cy="360" r="14" fill="#38bdf8" />
  <path d="M 256 332 L 256 388 M 228 360 L 284 360" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
</svg>
