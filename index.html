    <script>
      // Runtime constraint: In preview iFrame, HMR WebSocket is disabled. Ignore harmless WebSocket closing notifications.
      window.addEventListener('error', function(e) {
        if (e && e.message && e.message.includes('WebSocket')) {
          e.preventDefault();
        }
      });
      window.addEventListener('unhandledrejection', function(e) {
        if (e && e.reason && String(e.reason).includes('WebSocket')) {
          e.preventDefault();
        }
      });
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased font-sans selection:bg-blue-600 selection:text-white">
    <div id="root"></div>

  </body>
